[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "FOTA_backdoor"
version = "0.1.0"
description = "FOTA_Speech Recognition Backdoor Attack"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "torch>=1.12.0",
    "torchaudio>=0.12.0",
    "librosa==1.0.0",
    "einops>=0.6.0",
    "pandas>=1.5.0",
    "numpy>=1.21.0",
    "matplotlib>=3.5.0",
    "seaborn>=0.12.0",
    "scipy>=1.7.0",
    "pyyaml>=6.0",
    "tqdm>=4.64.0",
    "scikit-learn>=1.0.0",
    "pedalboard>=0.9.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "jupyter>=1.0.0",
    "black>=22.0"
]

[tool.setuptools.packages.find]
where = ["."]